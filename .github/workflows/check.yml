name: Check and package demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run build
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        with:
          name: snow-control-demo
          path: dist/sever-demo.html
          if-no-files-found: error
